{% load viewer_extras %}
{% comment %}
  그룹에 속한 모든 사진 — 합성본 · 깊이 맵 · 각 프레임.
  base 와 같은 것이 처음 선택된 상태가 된다 (= 검출을 돌린 그 이미지).
{% endcomment %}
{% if stack %}
  <button type="button" class="shot{% if stack.focused_rel == base %} on{% endif %}"
          data-view="{% thumb stack.focused_rel 1600 %}"
          data-full="{% full stack.focused_rel %}"
          data-title="합성본"
          data-note="그룹 전체에서 초점 맞은 영역만 모았다"
          {% if stack.focused_rel == base %}data-current="1"{% endif %}>
    <img loading="lazy" src="{% thumb stack.focused_rel 220 %}" alt="합성본">
    <span class="cap">합성본</span>
  </button>
  {% if stack.depth_rel %}
  <button type="button" class="shot"
          data-view="{% thumb stack.depth_rel 1600 %}"
          data-full="{% full stack.depth_rel %}"
          data-title="깊이 맵"
          data-note="Z 좌표가 없어 상대값이다 — 정량적 높이가 아니다">
    <img loading="lazy" src="{% thumb stack.depth_rel 220 %}" alt="깊이 맵">
    <span class="cap">깊이 맵</span>
  </button>
  {% endif %}
{% endif %}

{% for f in frames %}{% if f.exists %}
  <button type="button" class="shot{% if f.is_sharpest %} best{% endif %}{% if f.rel == base %} on{% endif %}"
          data-view="{% thumb f.rel 1600 %}"
          data-full="{% full f.rel %}"
          data-title="{{ f.name }}"
          data-note="선명도 {{ f.sharpness }}{% if f.is_sharpest %} · 그룹 내 최선{% endif %}{% if f.acquired_at %} · 촬영 {{ f.acquired_at|date:'Y-m-d H:i' }}{% endif %}{% if f.created_at %} · 반입 {{ f.created_at|date:'Y-m-d H:i' }}{% endif %}"
          data-raw="1"
          {# 캐러셀이 프레임을 바꿀 때 그 프레임의 검출로 갈아 끼우는 열쇠.
             검출이 프레임마다 따로 있는 화면(/engine/)에서만 쓰인다 — 없으면
             아무 일도 일어나지 않으므로 검토 화면은 그대로다 #}
          data-detkey="{{ f.name }}"
          {% if f.rel == base %}data-current="1"{% endif %}>
    <img loading="lazy" src="{% thumb f.rel 220 %}" alt="{{ f.name }}">
    <span class="cap">{{ f.name|cut:"Snap-" }}{% if f.is_sharpest %} ★{% endif %}</span>
    <span class="bar"><i style="width:{{ f.sharp_pct }}%"></i></span>
  </button>
{% endif %}{% endfor %}
