{% load viewer_extras %}<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}규조류 뷰어{% endblock %}</title>
<style>
  :root {
    --bg: #0f1115; --panel: #171a21; --line: #262b36;
    --fg: #e6e9ef; --dim: #8b93a3; --accent: #5ac8fa; --warn: #ffb454;
    --good: #7ee787; --danger: #ff6b6b;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f6f7f9; --panel: #fff; --line: #e0e3e9;
      --fg: #1a1d23; --dim: #6b7280; --accent: #0b7ec4; --warn: #b45309;
      --good: #15803d; --danger: #dc2626;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font: 14px/1.55 ui-sans-serif, system-ui, "Noto Sans KR", sans-serif;
  }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  /* 사진이 주인공이므로 머리글은 최대한 얇게. 경로·그룹·태그는 제목 옆의
     빈 자리에 한 줄로 넣는다 — 본문에서 세 줄을 걷어낼 수 있다. */
  header {
    padding: 6px 16px; border-bottom: 1px solid var(--line);
    background: var(--panel); position: sticky; top: 0; z-index: 10;
    display: flex; gap: 14px; align-items: baseline; flex-wrap: wrap;
  }
  header h1 { font-size: 13.5px; margin: 0; font-weight: 650; letter-spacing: .2px; }
  header .sub { font-size: 13px; color: var(--dim); min-width: 0; }
  header .sub b { color: var(--fg); font-weight: 650; }
  header nav { margin-left: auto; display: flex; gap: 14px; font-size: 13px; }
  main { padding: 5px 18px 22px; max-width: 1500px; margin: 0 auto; }
  h2 { font-size: 18px; margin: 0 0 4px; }
  .dim { color: var(--dim); }
  .mono { font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  .crumb { font-size: 13px; margin-bottom: 14px; }

  .cards { display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(310px, 1fr)); }
  .card {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 10px; padding: 16px;
  }
  .card h3 { margin: 0 0 10px; font-size: 15px; }
  .stat-row { display: flex; gap: 18px; flex-wrap: wrap; margin-top: 10px; }
  .stat b { display: block; font-size: 19px; font-weight: 650; }
  .stat span { font-size: 11px; color: var(--dim); text-transform: uppercase; letter-spacing: .5px; }

  .grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); }
  .tile {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 9px; overflow: hidden; display: block; color: inherit;
  }
  .tile:hover { border-color: var(--accent); text-decoration: none; }
  .tile img { width: 100%; aspect-ratio: 2752/2208; object-fit: cover; display: block; background: #000; }
  /* 표지 + 검출 마스크. 마스크가 있어야 목록에서 "무엇이 잡혔는지" 가 보인다. */
  .tile .thumbwrap {
    display: block; position: relative; width: 100%;
    aspect-ratio: 2752/2208; background: #000;
  }
  .tile .thumbwrap img { width: 100%; height: 100%; aspect-ratio: auto; }
  .tile .thumbwrap svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .tile .thumbwrap polygon { stroke-width: 0; }
  .tile .thumbwrap polygon.rod { fill: rgba(70,140,255,.45); }
  .tile .thumbwrap polygon.round { fill: rgba(60,220,120,.45); }
  .tile .thumbwrap polygon.manual { fill: rgba(255,180,70,.45); }
  .tile .thumbwrap polygon.rod_frag { fill: rgba(160,120,255,.45); }
  .tile .thumbwrap polygon.round_frag { fill: rgba(60,205,205,.45); }
  .tile .thumbwrap polygon.eucampia { fill: rgba(255,110,190,.5); }
  /* 사진이 여럿인 시야 — 인스타그램의 캐러셀 표시와 같은 모양.
     판을 깔지 않고 그림자로 띄운다. 썸네일은 밝기가 제각각이라 흰 선만으로는
     밝은 사진에서 묻히는데, drop-shadow 는 어두운 사진에서도 거슬리지 않는다. */
  .tile .multi {
    position: absolute; right: 7px; top: 7px; z-index: 2;
    width: 20px; height: 20px; line-height: 0;
    filter: drop-shadow(0 1px 2px rgba(0,0,0,.85));
  }
  .tile .multi svg { width: 100%; height: 100%; display: block; }
  .tile .multi .front {
    fill: none; stroke: #fff; stroke-width: 2;
  }
  .tile .multi .back {
    fill: none; stroke: #fff; stroke-width: 2;
    stroke-linecap: round;
  }
  .tile .thumbwrap polygon.none { fill: rgba(255,60,60,.34); }
  .tile .meta { padding: 8px 10px; font-size: 12px; }
  .tile .meta .t { font-weight: 600; }

  .badge {
    display: inline-block; padding: 1px 7px; border-radius: 999px;
    font-size: 11px; border: 1px solid var(--line); color: var(--dim);
  }
  .badge.on { color: var(--good); border-color: var(--good); }
  /* 검토 완료 — 다른 배지(초록·주황)와 갈라져야 목록에서 한눈에 짚인다 */
  .badge.done { color: var(--danger); border-color: var(--danger); }
  .badge.warn { color: var(--warn); border-color: var(--warn); }
  .badge.rod { color: var(--accent); border-color: var(--accent); }
  .badge.frag { color: #a78bfa; border-color: #a78bfa; }
  .badge.euc { color: #ff6ebe; border-color: #ff6ebe; }

  /* --- 문턱 조정 화면 ---
     한 시야를 보며 정한 값이 시야 전부에 걸리므로, 영향받는 시야를 영향 큰 순으로
     늘어놓고 뒤집히는 개체를 표시한다. */
  .thpanel { display: flex; gap: 14px; align-items: flex-start; flex-wrap: wrap; }
  .thgrid {
    flex: 1 1 460px; min-width: 0;
    display: grid; gap: 3px 10px; grid-template-columns: 1fr 1fr;
  }
  .throw {
    display: flex; flex-direction: column; gap: 1px;
    padding: 4px 6px; border-radius: 6px; border: 1px solid transparent;
  }
  .throw.changed { border-color: var(--accent); background: rgba(90,200,250,.07); }
  .throw label { font-size: 11.5px; }
  .thctl { display: flex; gap: 6px; align-items: center; }
  .thctl input[type=range] { flex: 1 1 auto; min-width: 0; accent-color: var(--accent); }
  .thctl input[type=number] {
    flex: 0 0 66px; width: 66px; font: inherit; font-size: 11.5px;
    padding: 1px 4px; background: var(--bg); color: var(--fg);
    border: 1px solid var(--line); border-radius: 5px;
  }
  .thwas { font-size: 10.5px; color: var(--dim); min-width: 62px; }

  .thside {
    flex: 0 0 250px; width: 250px;
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 9px; padding: 10px 11px;
  }
  .thsum { font-size: 12px; line-height: 1.6; min-height: 62px; }
  .thsum.busy { opacity: .5; }
  .thbig { font-size: 15px; }
  .up { color: var(--good); }
  .down { color: #ff6b6b; }
  .thbtns { display: flex; gap: 6px; margin: 9px 0 8px; }
  .thbtns button {
    font: inherit; font-size: 12px; padding: 4px 10px; cursor: pointer;
    background: var(--panel); color: inherit;
    border: 1px solid var(--line); border-radius: 6px;
  }
  .thbtns button:hover:not(:disabled) { border-color: var(--accent); }
  .thbtns button.go { margin-left: auto; border-color: var(--accent); color: var(--accent); }
  .thbtns button:disabled { opacity: .4; cursor: default; }
  .thscope { font-size: 12px; padding-top: 8px; border-top: 1px solid var(--line); }
  .thhist { margin-top: 9px; padding-top: 8px; border-top: 1px solid var(--line); }
  .thhead { font-size: 11.5px; font-weight: 650; margin-bottom: 5px; }
  .thhitem {
    display: block; width: 100%; text-align: left; font: inherit; font-size: 11px;
    background: transparent; color: inherit; cursor: pointer; line-height: 1.4;
    border: 1px solid transparent; border-radius: 5px; padding: 3px 5px;
  }
  .thhitem:hover { border-color: var(--accent); }

  /* 시야 격자 — 2컬럼. 800 px 썸네일이면 마스크 위치는 충분히 보이고,
     areolae 를 확대해 볼 일은 그룹 화면이 맡는다(원본 화소 전환이 있다). */
  .vpgrid { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(420px, 1fr)); }
  .vpcell {
    display: block; color: inherit; background: var(--panel);
    border: 1px solid var(--line); border-radius: 9px; overflow: hidden;
  }
  .vpcell:hover { border-color: var(--accent); text-decoration: none; }
  .vphead {
    display: flex; gap: 6px; align-items: baseline;
    padding: 6px 9px; font-size: 12px; border-bottom: 1px solid var(--line);
  }
  .vpimg { position: relative; line-height: 0; background: #000; }
  .vpimg img { width: 100%; display: block; }
  .vpimg svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .vpimg polygon { stroke-width: 0; }
  .vpimg polygon.rod { fill: rgba(70,140,255,.42); }
  .vpimg polygon.round { fill: rgba(60,220,120,.42); }
  .vpimg polygon.rod_frag { fill: rgba(160,120,255,.42); }
  .vpimg polygon.round_frag { fill: rgba(60,205,205,.42); }
  .vpimg polygon.eucampia { fill: rgba(255,110,190,.45); }
  .vpimg polygon.none { fill: rgba(255,60,60,.28); }
  /* 뒤집히는 것 — 이 문턱 때문에 빠지거나 들어오는 개체.
     들어오는 것을 초록으로 두면 원형(초록 fill) 위에서 안 보인다. 분류에 안 쓰는
     색을 골라야 한다 — 빠짐은 빨강, 들어옴은 노랑(선택 표시와 같은 색).
     어두운 후광을 먼저 깔아 어떤 배경에서도 보이게 한다. */
  .vpimg polygon.halo {
    fill: none; stroke: rgba(0,0,0,.85); stroke-width: 7px;
    vector-effect: non-scaling-stroke; stroke-linejoin: round;
  }
  .vpimg polygon.flip-out {
    fill: rgba(255,70,70,.22); stroke: #ff4d4d; stroke-width: 3px;
    vector-effect: non-scaling-stroke; stroke-linejoin: round;
  }
  .vpimg polygon.flip-in {
    fill: rgba(255,210,63,.26); stroke: #ffd23f; stroke-width: 3px;
    vector-effect: non-scaling-stroke; stroke-linejoin: round;
  }
  /* 기존 검출을 끄면 바뀌는 것만 남는다 — 찾기가 훨씬 쉽다 */
  .vpimg.only-flips polygon:not(.flip-in):not(.flip-out):not(.halo) { display: none; }
  .vphead .up { color: #ffd23f; }

  /* --- 검출 개체 크롭 갤러리 ---
     테두리 색이 형태 판정이다 — 봉상/원형/수동복구를 사진과 같은 색으로 쓴다. */
  .croptools {
    display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
    margin: 0 0 10px; font-size: 12.5px;
  }
  .chip {
    padding: 3px 11px; border-radius: 999px; font-size: 12px;
    border: 1px solid var(--line); color: var(--dim);
  }
  .chip:hover { border-color: var(--accent); color: var(--accent); text-decoration: none; }
  .chip.on { border-color: var(--accent); color: var(--accent); font-weight: 600; }
  .crops { display: grid; gap: 7px; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); }
  .crop {
    display: block; color: inherit; background: var(--panel);
    border: 1px solid var(--line); border-radius: 7px; overflow: hidden;
  }
  .crop:hover { border-color: var(--accent); text-decoration: none; }
  .crop.rod { border-color: rgba(70,140,255,.55); }
  .crop.round { border-color: rgba(60,220,120,.55); }
  .crop.rod_frag { border-color: rgba(160,120,255,.6); }
  .crop.round_frag { border-color: rgba(60,205,205,.6); }
  .crop.eucampia { border-color: rgba(255,110,190,.7); }
  .crop.manual { border-color: var(--warn); }
  /* 칸 높이는 고정, 이미지는 그 안에서 비율대로. 감싼 .cimg 가 이미지를 꼭
     감싸므로 그 안에 넣은 스케일바의 % 가 곧 이미지 폭이 된다 — object-fit
     여백에 어긋나지 않는다. */
  .crop .cbox {
    display: flex; align-items: center; justify-content: center;
    height: 190px; background: #000;
  }
  .crop .cimg { position: relative; display: inline-block; line-height: 0; }
  .crop .cimg img { display: block; max-height: 190px; max-width: 100%; }
  .crop .csb {
    position: absolute; left: 50%; bottom: 4px; transform: translateX(-50%);
    font-size: 9.5px; line-height: 1.1; color: #fff; text-align: center;
    text-shadow: 0 1px 2px #000, 0 0 3px #000; pointer-events: none;
  }
  .crop .csb b {
    display: block; height: 2.5px; background: #fff; border-radius: 1px;
    margin-bottom: 1.5px; box-shadow: 0 0 2px rgba(0,0,0,.9);
  }
  .crop .cap {
    display: flex; gap: 5px; align-items: center;
    padding: 3px 6px 4px; font-size: 11px; line-height: 1.3;
  }
  .crop .dot {
    width: 6px; height: 6px; border-radius: 50%; display: inline-block;
    margin-left: auto;
  }
  .crop .dot.warn { background: var(--warn); }
  .crop .dot.good { background: var(--good); }

  .frames { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); }
  .frame { background: var(--panel); border: 1px solid var(--line); border-radius: 9px; overflow: hidden; }
  .frame.best { border-color: var(--good); }
  .frame img { width: 100%; display: block; background: #000; cursor: zoom-in; }
  .frame .meta { padding: 8px 10px; font-size: 12px; }
  .bar { height: 4px; background: var(--line); border-radius: 2px; overflow: hidden; margin-top: 5px; }
  .bar i { display: block; height: 100%; background: var(--accent); }
  .frame.best .bar i { background: var(--good); }

  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  th, td { text-align: right; padding: 6px 10px; border-bottom: 1px solid var(--line); }
  th:first-child, td:first-child, th:nth-child(2), td:nth-child(2) { text-align: left; }
  th { color: var(--dim); font-weight: 600; font-size: 11px; text-transform: uppercase; letter-spacing: .4px; }
  .scroll { overflow-x: auto; }

  /* --- 탭 (검출 화면 / 개체 목록) --- */
  .dettabs {
    display: flex; gap: 2px; align-items: center; flex-wrap: wrap;
    margin: 0 0 8px; border-bottom: 1px solid var(--line);
  }
  /* 한 페이지에 패널이 둘 이상일 때(합성본이 없어 프레임마다 검출한 그룹)만
     위에 간격을 준다. 첫 패널은 사진이 곧바로 나와야 한다. */
  section ~ .dettabs { margin-top: 22px; }
  .dettabs button {
    font: inherit; font-size: 13.5px; padding: 7px 15px; cursor: pointer;
    background: transparent; color: var(--dim); border: 0;
    border-bottom: 2px solid transparent; margin-bottom: -1px;
  }
  .dettabs button:hover { color: var(--fg); }
  .dettabs button.on { color: var(--fg); font-weight: 600; border-bottom-color: var(--accent); }
  .dettabs .tabmeta { margin-left: auto; font-size: 12px; color: var(--dim); padding-bottom: 6px; }

  /* --- 사진 + 코멘트 목록 --- */
  .detrow { display: flex; gap: 10px; align-items: flex-start; }
  .detrow .detview { flex: 1 1 auto; min-width: 0; }
  /* 위(개체 코멘트)·아래(시야 코멘트) 두 칸이 각각 스크롤된다. 아래 칸은 높이를
     고정해 두어 개체 코멘트가 길어져도 밀려나지 않는다. */
  .notes {
    flex: 0 0 250px; width: 250px; align-self: stretch;
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 9px; padding: 9px 10px; line-height: 1.5;
    max-height: 78vh; overflow: hidden;
    display: flex; flex-direction: column;
  }
  .notes .nhead, .notes .ghead {
    flex: 0 0 auto;
    font-size: 12px; font-weight: 650; margin-bottom: 7px;
    padding-bottom: 6px; border-bottom: 1px solid var(--line);
  }
  .notes .ghead { margin-top: 9px; }
  .notes .nlist { flex: 1 1 auto; min-height: 60px; overflow-y: auto; }
  /* 그 자리에서 바로 적는다 — 팝업을 열지 않는다. 높이는 고정. */
  .notes .gnote {
    flex: 0 0 132px; height: 132px; overflow-y: auto; resize: none;
    display: block; width: 100%; font: inherit; font-size: 12px;
    line-height: 1.5; background: var(--bg); color: inherit;
    border: 1px solid var(--line); border-radius: 7px; padding: 6px 7px;
  }
  .notes .gnote:hover { border-color: var(--accent); }
  .notes .gnote:focus { outline: none; border-color: var(--accent); }
  .notes .nitem {
    display: block; width: 100%; text-align: left; font: inherit;
    background: transparent; color: inherit; cursor: pointer;
    border: 1px solid transparent; border-radius: 7px;
    padding: 6px 7px; margin-bottom: 4px; font-size: 12px;
  }
  .notes .nitem:hover, .notes .nitem.on {
    border-color: var(--accent); background: rgba(90,200,250,.09);
  }
  .notes .nitem .ntop {
    display: flex; gap: 6px; align-items: baseline;
    font-size: 11px; color: var(--dim); margin-bottom: 2px;
  }
  .notes .nitem .ntext { white-space: pre-wrap; word-break: break-word; }
  .notes .nempty { font-size: 12px; color: var(--dim); }

  /* --- 코멘트 편집 --- */
  .noteedit {
    position: fixed; z-index: 75; width: 300px; padding: 10px 11px;
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 9px; box-shadow: 0 10px 30px rgba(0,0,0,.45);
  }
  .noteedit .nlabel { font-size: 11.5px; color: var(--dim); margin-bottom: 6px; }
  .noteedit textarea {
    width: 100%; min-height: 74px; resize: vertical; font: inherit;
    font-size: 12.5px; padding: 6px 7px; border-radius: 6px;
    background: var(--bg); color: var(--fg); border: 1px solid var(--line);
  }
  .noteedit .nrow { display: flex; gap: 6px; margin-top: 8px; }
  .noteedit button {
    font: inherit; font-size: 12px; padding: 4px 11px; cursor: pointer;
    background: var(--panel); color: inherit;
    border: 1px solid var(--line); border-radius: 6px;
  }
  .noteedit button:hover { border-color: var(--accent); }
  .noteedit button.danger { color: #ff6b6b; }
  .noteedit .nhint { margin-left: auto; font-size: 11px; color: var(--dim); align-self: center; }

  /* --- 대화형 검출 레이어 --- */
  .detview {
    position: relative; display: block; line-height: 0;
    border: 1px solid var(--line); border-radius: 9px; overflow: hidden;
    background: #000; user-select: none; cursor: crosshair;
  }
  .detview .canvas { transform-origin: 0 0; will-change: transform; }
  .detview img { width: 100%; display: block; }
  /* instance mask — 이미지 위에 겹치되 마우스는 통과시킨다 (히트 판정은 bbox 가 한다) */
  .detview svg.masks {
    position: absolute; left: 0; top: 0; width: 100%; height: 100%;
    pointer-events: none;
  }
  .detview svg.masks polygon { stroke-width: 0; }
  /* 탈락 후보 — 테두리만 빨간 점선으로 그린다. 채우면 사진이 가려져 정작
     "이게 규조각인가" 를 판단할 수 없다. 두께·점선 간격은 확대해도 그대로다. */
  .detview svg.masks polygon.reject {
    fill: none; stroke: rgba(255,70,70,.92);
    stroke-width: 1.4px; stroke-dasharray: 5 4;
    vector-effect: non-scaling-stroke;
  }
  .detview.hide-reject svg.masks polygon.reject { display: none; }
  .detview svg.masks polygon.rod    { fill: rgba(70,140,255,.42); }
  .detview svg.masks polygon.round  { fill: rgba(60,220,120,.42); }
  .detview svg.masks polygon.manual { fill: rgba(255,180,70,.42); }
  .detview svg.masks polygon.none   { fill: rgba(255,60,60,.30); }
  .detview svg.masks polygon.rod_frag   { fill: rgba(160,120,255,.42); }
  .detview svg.masks polygon.round_frag { fill: rgba(60,205,205,.42); }
  /* Eucampia — 형태가 아니라 속으로 알아본 것이라 색을 따로 준다 */
  .detview svg.masks polygon.eucampia   { fill: rgba(255,110,190,.45); }
  .detview svg.masks polygon.sel    { fill: rgba(255,210,63,.55); }
  /* fill 을 끄면 마스크를 테두리만 그린다. 채운 색을 그대로 선으로 옮기되
     불투명하게 올린다 — 얇은 선은 반투명하면 잘 안 보인다.
     두께는 non-scaling-stroke 라 확대해도 화면에서 같게 보인다. */
  .detview.hide-fill svg.masks polygon:not(.reject) {
    fill: none; stroke-width: 1.6px; vector-effect: non-scaling-stroke;
  }
  .detview.hide-fill svg.masks polygon.rod        { stroke: rgba(70,140,255,.95); }
  .detview.hide-fill svg.masks polygon.round      { stroke: rgba(60,220,120,.95); }
  .detview.hide-fill svg.masks polygon.manual     { stroke: rgba(255,180,70,.95); }
  .detview.hide-fill svg.masks polygon.none       { stroke: rgba(255,60,60,.9); }
  .detview.hide-fill svg.masks polygon.rod_frag   { stroke: rgba(160,120,255,.95); }
  .detview.hide-fill svg.masks polygon.round_frag { stroke: rgba(60,205,205,.95); }
  .detview.hide-fill svg.masks polygon.eucampia   { stroke: rgba(255,110,190,.95); }
  .detview.hide-fill svg.masks polygon.sel        { stroke: rgba(255,210,63,1); stroke-width: 2.2px; }
  /* 네 귀퉁이가 다 쓰인다: 좌상 교정 도구, 우상 레이어 토글, 우하 스케일바,
     하단 가운데 검토 완료. 배율 표시는 남은 좌하단으로 뺀다. */
  /* 배율은 원본 화소 기준이라 확대하지 않은 상태(예: 53%)도 뜻이 있는 값이다.
     그래서 늘 보인다 — 지금 원본을 다 보고 있는지 알아야 한다. */
  .detview .zoomtag {
    position: absolute; left: 8px; bottom: 10px; z-index: 3;
    background: rgba(0,0,0,.6); color: #fff; font-size: 11px; line-height: 1.5;
    padding: 2px 7px; border-radius: 5px;
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
  }

  /* --- 교정 도구 (사진 좌상단) ---
     사진에서 눈을 떼지 않고 조작하려면 버튼이 사진 위에 있어야 한다.
     캔버스의 확대·선택 판정이 버튼 클릭을 삼키지 않게 JS 에서 전파를 끊는다. */
  .detview .tools {
    position: absolute; left: 8px; top: 8px; z-index: 5;
    display: flex; gap: 5px; flex-wrap: wrap; max-width: calc(100% - 190px);
    line-height: 1.2; cursor: default;
  }
  .detview .tools button {
    font: inherit; font-size: 11.5px; padding: 4px 9px; cursor: pointer;
    background: rgba(0,0,0,.62); color: #fff;
    border: 1px solid rgba(255,255,255,.22); border-radius: 6px;
  }
  .detview .tools button:hover { border-color: var(--accent); color: var(--accent); }
  .detview .tools button.danger:hover { border-color: #ff6b6b; color: #ff8a8a; }

  /* --- 검토 완료 (사진 하단 가운데) --- */
  .detview .donebar {
    position: absolute; left: 50%; bottom: 12px; z-index: 5;
    transform: translateX(-50%); cursor: default;
  }
  .detview .donebar button {
    font: inherit; font-size: 15px; font-weight: 650; padding: 11px 26px;
    cursor: pointer; border-radius: 10px; letter-spacing: .2px;
    background: rgba(0,0,0,.7); color: #fff;
    border: 1px solid rgba(255,255,255,.34);
    box-shadow: 0 3px 14px rgba(0,0,0,.4);
  }
  .detview .donebar button:hover { border-color: var(--accent); color: var(--accent); }
  /* 완료된 것은 완료됐다고 못 박는다 — 목록의 ✓ 검토 배지와 같은 초록이다. */
  .detview .donebar button.on {
    background: rgba(26,110,55,.86); border-color: #7ee787; color: #eaffe9;
  }
  .detview .donebar button.on:hover { border-color: #fff; color: #fff; }

  /* --- 레이어 토글 (사진 우상단) ---
     끄더라도 .box 요소는 남긴다 — 클릭 판정을 bbox 가 하므로 지우면 선택이 죽는다.
     테두리만 투명하게 만들고, 선택·hover 표시는 남겨 조작감을 유지한다. */
  .detview .layers {
    position: absolute; right: 8px; top: 8px; z-index: 5;
    display: flex; gap: 11px; padding: 5px 10px; border-radius: 7px;
    background: rgba(0,0,0,.62); line-height: 1.2; cursor: default;
  }
  .detview .layers label {
    display: flex; align-items: center; gap: 5px;
    font-size: 11.5px; color: #fff; cursor: pointer;
  }
  .detview .layers input { margin: 0; cursor: pointer; accent-color: #5ac8fa; }
  /* fill 은 mask 가 꺼져 있으면 뜻이 없다. 감추지 않고 잠근다 — 자리가 사라지면
     옆 항목이 밀려서 껐다 켜는 동안 마우스가 엉뚱한 것을 누른다. */
  .detview .layers label.off { opacity: .4; cursor: default; }
  .detview .layers label.off input { cursor: default; }

  /* --- 스케일바 (사진 우하단) ---
     canvas 가 아니라 detview 의 자식이라 확대/이동 변환을 받지 않는다.
     그래서 어디로 끌고 가든 늘 같은 자리에 보이고, 길이만 배율에 맞춰 바뀐다. */
  .detview .scalebar {
    position: absolute; right: 10px; bottom: 10px; z-index: 5;
    padding: 6px 9px 5px; border-radius: 6px; background: rgba(0,0,0,.62);
    color: #fff; pointer-events: none; text-align: center;
  }
  .detview .scalebar i {
    display: block; height: 4px; background: #fff; border-radius: 1px;
    min-width: 20px; margin: 0 auto 4px;
  }
  .detview .scalebar span {
    display: block; font-size: 11px; line-height: 1.1;
    font-family: ui-monospace, "SF Mono", Menlo, monospace; letter-spacing: .2px;
  }

  /* --- 사진 캐러셀 --- */
  .shotcap {
    display: flex; gap: 12px; align-items: baseline; flex-wrap: wrap;
    padding: 9px 2px 0; font-size: 13px; line-height: 1.5;
  }
  .shotcap a { margin-left: auto; font-size: 12px; }
  .strip {
    display: flex; gap: 8px; overflow-x: auto; padding: 9px 2px 4px;
    scrollbar-width: thin;
  }
  /* 썸네일 목록 좌우의 이동 버튼. 높이는 썸네일에 맞추고 폭만 좁게 잡는다:
     align-items:stretch 로 늘리고, .strip 의 위아래 padding 을 margin 으로
     그대로 흉내내면 썸네일 자체와 정확히 같은 높이가 된다. */
  .striprow { display: flex; gap: 6px; align-items: stretch; }
  .striprow .strip { flex: 1 1 auto; min-width: 0; }   /* min-width 가 없으면 안 줄어든다 */
  .navbtn {
    flex: 0 0 auto; width: 26px; margin: 9px 0 4px; padding: 0;
    display: flex; align-items: center; justify-content: center;
    background: var(--panel); color: var(--dim);
    border: 1px solid var(--line); border-radius: 7px;
    font: inherit; font-size: 14px; line-height: 1; cursor: pointer;
  }
  .navbtn.grp { width: 30px; }
  .navbtn:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
  .navbtn:disabled { opacity: .28; cursor: default; }
  .strip .shot {
    flex: 0 0 auto; width: 128px; padding: 0; cursor: pointer;
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 8px; overflow: hidden; color: inherit;
    font: inherit; text-align: left; line-height: 1.4;
    /* 버튼은 내용을 수직 중앙에 놓는다. 선명도 막대가 없는 합성본·깊이 맵은
       그래서 사진이 아래로 내려가 다른 썸네일과 어긋난다. 위에서부터 쌓는다. */
    display: flex; flex-direction: column;
  }
  .strip .shot:hover { border-color: var(--accent); }
  .strip .shot.on { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent) inset; }
  .strip .shot.best .cap { color: var(--good); }
  /* flex-shrink 를 막아야 한다 — 늘어난 칸에서 사진이 눌리면 배율이 달라 보인다. */
  .strip .shot img {
    flex: 0 0 auto; width: 100%; aspect-ratio: 2752/2208;
    object-fit: cover; display: block; background: #000;
  }
  .strip .shot .cap { display: block; padding: 5px 7px 2px; font-size: 11px; }
  /* 막대는 아래에 붙인다 — 막대가 있는 썸네일끼리도 높이가 맞는다. */
  .strip .shot .bar { height: 3px; margin: auto 7px 7px; }
  .detview .box.manual { border-style: dashed; border-color: #ffb454; }
  /* 오검출로 지운 것 — 흔적만 남겨 클릭 한 번으로 되살릴 수 있게 한다.
     채우면 아래 이미지가 가려져 지운 게 맞는지 확인할 수 없으므로 테두리만 그린다. */
  .detview .box.gone {
    border-style: dotted; border-color: rgba(255,80,80,.85);
    background: none; opacity: .8;
  }
  .detview .box.gone:hover { opacity: 1; border-color: #ffd23f; }
  .detview .box.gone::after {
    content: "✕"; position: absolute;
    right: calc(1px * var(--inv, 1)); top: calc(-1px * var(--inv, 1));
    font: calc(10px * var(--inv, 1))/1 ui-sans-serif, system-ui;
    color: rgba(255,255,255,.75);
  }

  /* 빈 곳 클릭 시 펼쳐지는 탈락 후보 선택기 */
  .spread {
    position: fixed; z-index: 60; background: var(--panel);
    border: 1px solid var(--line); border-radius: 9px; padding: 10px 12px;
    box-shadow: 0 10px 34px rgba(0,0,0,.45); max-width: 520px;
  }
  .spread .shead { font-size: 12px; margin-bottom: 8px; color: var(--dim); padding-right: 26px; }
  .spread .sclose {
    position: absolute; right: 7px; top: 6px; width: 22px; height: 22px;
    display: flex; align-items: center; justify-content: center;
    font: inherit; font-size: 12px; line-height: 1; cursor: pointer;
    background: transparent; color: var(--dim);
    border: 1px solid var(--line); border-radius: 6px; padding: 0;
  }
  .spread .sclose:hover { border-color: var(--accent); color: var(--accent); }
  .spread .sgrid {
    display: flex; gap: 8px; flex-wrap: wrap; max-width: 720px;
    align-items: flex-start; max-height: 74vh; overflow-y: auto;
  }
  .spread .scell {
    padding: 0; cursor: pointer; font: inherit; color: inherit;
    background: transparent; border: 1px solid var(--line); border-radius: 7px;
    overflow: hidden; text-align: center;
    display: flex; flex-direction: column; align-items: stretch;
  }
  .spread .scell:hover { border-color: var(--accent); }
  /* 칸 크기를 크롭의 종횡비대로 JS 가 정한다 — 늘리지 않는다. */
  .spread .scrop { display: block; position: relative; background: #000; }
  .spread .scrop img { width: 100%; height: 100%; display: block; }
  .spread .scrop svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .spread .scrop polygon {
    fill: rgba(255,210,63,.30); stroke: rgba(255,235,150,.95);
    stroke-width: 1.4px; vector-effect: non-scaling-stroke;
  }
  .spread .scap { display: block; padding: 4px 5px 6px; font-size: 10.5px; line-height: 1.35; }

  .ctxmenu {
    position: fixed; z-index: 70; min-width: 176px; padding: 4px;
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 8px; box-shadow: 0 8px 26px rgba(0,0,0,.45);
  }
  .ctxmenu button {
    display: block; width: 100%; text-align: left; font: inherit; font-size: 12.5px;
    padding: 6px 10px; background: transparent; color: inherit;
    border: 0; border-radius: 5px; cursor: pointer;
  }
  .ctxmenu button:hover:not(:disabled) { background: var(--line); }
  .ctxmenu button:disabled { opacity: .4; cursor: default; }
  .ctxmenu button.danger { color: #ff6b6b; }
  .ctxmenu .msep { height: 1px; background: var(--line); margin: 4px 6px; }

  /* 캐러셀 끝에서 → 를 누르면 다음 시야로 넘어갈지 묻는다.
     "다시 묻지 않기" 를 넣어야 하므로 confirm() 으로는 안 된다. */
  .askwrap {
    position: fixed; inset: 0; z-index: 80; display: flex;
    align-items: center; justify-content: center; background: rgba(0,0,0,.45);
  }
  .askbox {
    background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
    padding: 15px 18px 16px; max-width: 380px; font-size: 13px; line-height: 1.6;
    box-shadow: 0 14px 40px rgba(0,0,0,.5);
  }
  .askbox h3 { margin: 0 0 4px; font-size: 13.5px; }
  .askbox label {
    display: flex; gap: 6px; align-items: center;
    margin-top: 11px; font-size: 12px; color: var(--dim); cursor: pointer;
  }
  .askbox .askrow { display: flex; gap: 8px; margin-top: 13px; }
  .askbox .askrow button {
    font: inherit; font-size: 12.5px; padding: 5px 12px; cursor: pointer;
    background: var(--panel); color: inherit;
    border: 1px solid var(--line); border-radius: 6px;
  }
  .askbox .askrow button:hover { border-color: var(--accent); }
  .askbox .askrow button.go { border-color: var(--accent); color: var(--accent); }
  /* 두께는 --inv(= 1/배율) 를 곱해 화면에서 늘 같게 보이도록 한다. canvas 가
     scale(k) 로 확대되므로 곱해 두지 않으면 선까지 k 배로 두꺼워진다.
     --inv 는 applyTransform() 이 canvas 에 얹는다. */
  .detview .box {
    position: absolute; cursor: pointer;
    border-style: solid; border-color: rgba(255,60,60,.85);
    border-width: calc(2px * var(--inv, 1));
    border-radius: calc(2px * var(--inv, 1));
  }
  .detview .box.rod   { border-color: rgba(70,140,255,.9); }
  .detview .box.round { border-color: rgba(60,220,120,.9); }
  .detview .box.rod_frag   { border-color: rgba(160,120,255,.95); }
  .detview .box.round_frag { border-color: rgba(60,205,205,.95); }
  .detview .box.eucampia   { border-color: rgba(255,110,190,.95); }
  /* 사람이 지정한 분류는 실선 대신 굵은 점선 — 자동 판정과 구분된다 */
  .detview .box.userset { border-style: dashed; }
  .detview .box.hot   { border-width: calc(3px * var(--inv, 1));
                        box-shadow: 0 0 0 calc(2px * var(--inv, 1)) rgba(255,255,255,.55); }
  .detview .box.sel {
    border-color: #ffd23f; border-width: calc(3px * var(--inv, 1));
    background: rgba(255,210,63,.18);
  }
  .detview .band {
    position: absolute; border: 1px dashed #ffd23f;
    background: rgba(255,210,63,.12); pointer-events: none; display: none;
  }

  /* 레이어 끄기 — .box.rod/.gone/.manual 뒤에 와야 색을 덮는다.
     선택과 hover 표시는 남긴다: 안 보이는 것을 조작하고 있으면 헷갈린다. */
  .detview.hide-box .box,
  .detview.hide-box .box.rod,
  .detview.hide-box .box.round,
  .detview.hide-box .box.manual,
  .detview.hide-box .box.rod_frag,
  .detview.hide-box .box.round_frag,
  .detview.hide-box .box.eucampia,
  .detview.hide-box .box.gone { border-color: transparent; background: none; }
  .detview.hide-box .box.gone::after { display: none; }
  .detview.hide-box .box.hot { border-color: rgba(255,255,255,.8); }
  .detview.hide-box .box.sel { border-color: #ffd23f; background: rgba(255,210,63,.18); }
  .detview.hide-mask svg.masks polygon:not(.reject) { display: none; }
  .dettip {
    position: fixed; z-index: 50; pointer-events: none; display: none;
    background: var(--panel); color: var(--fg);
    border: 1px solid var(--line); border-radius: 7px;
    padding: 8px 11px; font-size: 12px; line-height: 1.5;
    box-shadow: 0 6px 22px rgba(0,0,0,.35); max-width: 260px;
  }
  .dettip b { font-size: 12px; }
  .dettip table { width: 100%; font-size: 11.5px; }
  .dettip td { padding: 1px 0; border: 0; }
  .dettip td:last-child { text-align: right; font-family: ui-monospace, Menlo, monospace; }
  .detbar {
    display: flex; gap: 14px; align-items: center; flex-wrap: wrap;
    margin: 9px 0 2px; font-size: 12.5px;
  }
  .detbar .hint { color: var(--dim); font-size: 11.5px; }
  .detbar button {
    font: inherit; font-size: 12px; padding: 3px 10px; cursor: pointer;
    background: var(--panel); color: inherit;
    border: 1px solid var(--line); border-radius: 6px;
  }
  .detbar button:hover { border-color: var(--accent); }

  .note {
    background: var(--panel); border: 1px solid var(--line);
    border-left: 3px solid var(--warn); border-radius: 6px;
    padding: 10px 14px; margin: 14px 0; font-size: 13px;
  }
  .panels { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); }
  .panels figure { margin: 0; background: var(--panel); border: 1px solid var(--line); border-radius: 9px; overflow: hidden; }
  .panels img { width: 100%; display: block; background: #000; cursor: zoom-in; }
  .panels figcaption { padding: 8px 12px; font-size: 12px; color: var(--dim); }
</style>
</head>
<body>
<header>
  <h1><a href="/" style="color:inherit">규조류 뷰어</a></h1>
  <span class="sub">{% block subtitle %}{% endblock %}</span>
  <nav>{% block nav %}{% endblock %}</nav>
</header>
<main>{% block content %}{% endblock %}</main>
<script>
  // 뒤로 가기로 돌아오면 브라우저가 캐시된 화면을 되살린다(bfcache). 교정·검토
  // 표시와 마스크가 옛것이 되므로 그때는 다시 받는다.
  window.addEventListener('pageshow', function (e) {
    if (e.persisted) location.reload();
  });
</script>
</body>
</html>
