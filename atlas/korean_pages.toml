# 한국동식물도감 제9권(담수조류) 발췌본 — 쪽 대응표
#
# **색인 원문(`md/korean_flora_diatom_index.md`)에는 이 자료가 없다.** 색인이
# 자리 표기를 넷으로 못박아 두었는데(`#`·`pl.`·`책 p.`·`PDF p.`) **도판이 PDF
# 몇 쪽인지 적는 칸이 아예 없고**, 481~680 은 페이지 이미지로 판독한 구간이라
# `PDF p.` 도 안 따라왔다. 그래서 화면이 한국 도감만 도판으로 못 이었다
# (`pdf_plate_page` 가 512자리 전부 NULL · `pdf_page` 는 201자리가 NULL).
#
# **색인은 안 고친다** — 인용의 근거라 기계가 늘려 쓰면 안 된다(P15 4.2 ·
# `annotate_index.py` 머리말). 대신 잰 것을 여기 두고 `tools/parse_atlas.py`
# 가 읽어 채운다. `coredata/mapping.toml`(P17)과 같은 자리다 — **사람이 확인한
# 판단은 커밋한다.**
#
# 147 · 2026-08-23

[source]
pdf   = "origin/korean_flora_diatom.pdf"   # 270쪽 발췌본
pages = 270

# ── 책 쪽 ↔ PDF 쪽 ─────────────────────────────────────────────────────────
#
# **잰 것이지 가정이 아니다.** 발췌본은 원본에서 앞을 잘라낸 것이고 **도판이
# 책 쪽번호를 함께 먹는다** — 도판 쪽에는 번호가 안 찍혀 있지만 쪽수는 센다.
# 그래서 옵셋이 도판을 지나도 안 밀린다.
#
#   PDF 41–190  텍스트 레이어에서 인쇄된 쪽번호를 읽어 **도판 아닌 113쪽 전부**
#               가 `PDF + 99` 였다. 어긋난 것 0
#   PDF 191–270 텍스트 레이어가 없다. 쪽 머리를 렌더해 **눈으로** 읽었고
#               (191·192·…·270) 읽힌 것이 전부 `PDF + 99` 였다. 끝쪽 270 =
#               책 369 로, 색인 머리말의 "발췌본이 p.369에서 끝난다" 와 맞는다
#
# **색인이 적어 온 `PDF p.` 311개 중 309개가 이 값과 같다.** 어긋난 둘은
# 옵셋이 흔들린 것이 아니라 **색인의 `책 p.` 가 틀린 것**이다(아래 [오탈자]).

[offset]
book_minus_pdf = 99
verified_text_layer = "PDF 41–190 · 도판 아닌 113쪽 전부"
verified_by_eye     = "PDF 191–270 · 쪽 머리 렌더"

# ── 도판이 PDF 몇 쪽인가 ───────────────────────────────────────────────────
#
# 54개(Plate 21–74). **색인이 인용하는 것은 53개다** — Plate 69 는 아무 항목도
# 안 부른다(책에는 있다). 없는 것을 지어내지 않았으므로 그대로 둔다.
#
# 출처가 둘이고 서로 겹치지 않는다.
#   text  PDF 1–190 은 텍스트 레이어에 도판 캡션이 남아 있어 `Plate NN` 을
#         기계가 읽었다(34개). 그중 셋(23·46·51)은 번호가 캡션 숫자에 묻혀
#         쪽 머리를 눈으로 확인했다
#   eye   PDF 191–270 은 텍스트 레이어가 없어 쪽 머리를 렌더해 읽었다(17개)
#
# **검산 셋이 선다** — (1) 번호가 PDF 차례대로 오른다 (2) 21~74 에 빈 번호가
# 없다 (3) 도판 책 쪽이 그것을 부르는 항목의 책 쪽에서 9쪽 안쪽이고 **언제나
# 앞선다**(도판이 묶음째 끼워져 있다. 40개는 항목 구간 안에 있다).
# 그 셋을 `parse_atlas.py` 가 돌 때마다 다시 본다.

