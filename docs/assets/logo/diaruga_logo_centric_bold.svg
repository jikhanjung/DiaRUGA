<desc style="fill:rgb(0, 0, 0);stroke:none;color:rgb(11, 11, 11);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">좌측 상단의 센트릭 규조를 워드마크와 같은 진한 색과 굵기로 강조하고, 저각 대각선의 펜네이트 규조는 배경에 옅게 깐 DiaRUGA 로고</desc>
