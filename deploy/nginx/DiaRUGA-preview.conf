# DiaRUGA **미리보기** — 배포 전 화면을 80 의 /DiaRUGA-preview/ 아래에 잠깐 얹는다.
#
# 왜 필요한가: 사내 VPN 이 80 만 통과시킨다(DiaRUGA-subpath.conf 머리말과 018 의
# 같은 이유). runserver 를 8099 에 띄워도 VPN 밖에서는 닿지 않는다.
#
# **이것은 임시다.** 붙는 곳은 `manage.py runserver` 로 띄운 사본 DB 이고,
# 그 프로세스가 없으면 502 가 난다. 배포가 끝나면 이 파일과 include 한 줄을
# 지운다 — 남겨 두면 "왜 502 가 나지" 로 돌아온다.
#
# 설치:
#   sudo cp <이 파일> /etc/nginx/snippets/DiaRUGA-preview.conf
#   # /etc/nginx/sites-enabled/phyloserver 의 server 블록 안에 한 줄:
#   #     include snippets/DiaRUGA-preview.conf;
#   sudo nginx -t && sudo systemctl reload nginx
#
# 걷어내기:
#   sudo rm /etc/nginx/snippets/DiaRUGA-preview.conf
#   # phyloserver 에서 include 한 줄을 지우고
#   sudo nginx -t && sudo systemctl reload nginx
#
# **`^~` 가 있어야 한다.** phyloserver 블록에는 정규식 location 이 있고 nginx 는
# 접두 location 보다 정규식을 먼저 본다. `^~` 는 접두가 맞으면 정규식을 보지
# 말라는 뜻이다 — 정식 /DiaRUGA/ 블록이 같은 이유로 그것을 달고 있다.
#
# **끝의 슬래시가 핵심이다.** 이것이 있어야 nginx 가 /DiaRUGA-preview/ 를 떼고
# 넘긴다. runserver 쪽은 DIARUGA_SCRIPT_NAME=/DiaRUGA-preview 로 띄워야 앱이
# 만드는 링크가 이 접두를 달고 나온다.

location ^~ /DiaRUGA-preview/ {
    proxy_pass http://127.0.0.1:8099/;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # 원본을 줄여 내보내는 요청이 있어 기본 60초로는 모자랄 때가 있다
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
    client_max_body_size 32m;
}
