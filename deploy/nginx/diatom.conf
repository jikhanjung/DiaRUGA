# diatom 뷰어 앞단 (P03).
#
# 설치:
#   sudo cp deploy/nginx/diatom.conf /etc/nginx/sites-available/diatom
#   sudo ln -sf /etc/nginx/sites-available/diatom /etc/nginx/sites-enabled/diatom
#   sudo nginx -t && sudo systemctl reload nginx
#
# 포트를 나눈 구성이다. 80 을 쓰지 않는 이유: 이 머신의 80 은 phyloserver 블록이
# server_name 172.16.116.98 로 이미 잡고 있다. 서브경로(/diatom/)로 얹으려면
# FORCE_SCRIPT_NAME 에 더해 템플릿의 fetch() 5곳이 절대경로라 손봐야 한다.
#
#   바깥 :9090  ──nginx──▶  127.0.0.1:8090 (컨테이너)
#
# 컨테이너는 루프백에만 붙는다(compose 의 ports 참고). 바깥으로 나가는 문은
# 여기 하나뿐이다.

server {
    listen 9090;
    listen [::]:9090;
    server_name 172.16.116.98 paleo-server localhost;

    # 뷰어는 인증이 없다. 사내망 밖으로 낼 물건이 아니다 (settings.py 머리말).
    # 필요해지면 여기에 auth_basic 을 걸면 된다 — Django 를 건드리지 않아도 된다.

    # 2752x2208 원본을 줄여 내보내는 요청이 있어 기본 60초로는 모자랄 때가 있다
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;

    # 교정 저장(POST /review)은 폴리곤이 실려 커질 수 있다
    client_max_body_size 32m;

    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 썸네일이 줄줄이 나가므로 버퍼링을 켜 둔다 (기본값이지만 명시한다)
        proxy_buffering on;
    }
}
