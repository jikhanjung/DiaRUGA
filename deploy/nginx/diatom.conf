# diatom 뷰어의 옛 주소(:9090) — 지금은 80 으로 넘겨 주기만 한다.
#
# 설치:
#   sudo cp deploy/nginx/diatom.conf /etc/nginx/sites-available/diatom
#   sudo ln -sf /etc/nginx/sites-available/diatom /etc/nginx/sites-enabled/diatom
#   sudo nginx -t && sudo systemctl reload nginx
#
# 처음에는 여기가 실제로 서빙했다. 80 은 phyloserver 블록이
# server_name 172.16.116.98 로 이미 잡고 있어서 포트를 나눈 것이었다.
#
# **사내 VPN 이 9090 을 통과시키지 않는다.** 그래서 서빙을 80 의 /diatom/ 아래로
# 옮겼다 (`diatom-subpath.conf`). 여기를 계속 서빙하게 두면 안 된다 —
# FORCE_SCRIPT_NAME=/diatom 때문에 앱이 만드는 링크가 전부 /diatom/… 인데
# 이 블록은 접두를 떼지 않으므로 눌러 보면 404 가 된다.
#
# 서빙하는 경로를 **하나로** 두고, 옛 주소는 새 주소로 보낸다. 적어 둔 북마크가
# 조용히 깨지는 것보다 낫다.
#
#   바깥 :9090  ──301──▶  http://<host>/diatom/…

server {
    listen 9090;
    listen [::]:9090;
    server_name 172.16.116.98 paleo-server localhost;

    return 301 http://$host/diatom$request_uri;
}
