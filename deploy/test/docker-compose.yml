# DiaRUGA 테스트 인스턴스 — 80 포트의 /DiaRUGATest/ 아래.
#
#   cd /srv/DiaRUGA/test && docker compose up -d web
#
# **운영과 갈라 두는 것이 넷이다.** 하나라도 운영과 같아지면 테스트가 운영을
# 만진다 — 사람의 교정 7,472건은 재생성 불가다.
#
#   1. DB       /srv/DiaRUGA/test/db/  ← 사본. 운영의 db/ 를 절대 물리지 않는다
#   2. 노두 사진 /srv/DiaRUGA/test/outcrop/  ← 사본. NAS 원본이 아니다
#   3. 포트     127.0.0.1:8091 (운영은 8090)
#   4. 프로젝트 이름 diaruga-test (운영은 diaruga)
#
# **파이프라인·dbtool 서비스를 여기 두지 않는다.** 테스트에서 GPU 작업이나
# DB 스크립트를 돌릴 일이 없고, 있으면 운영 자리와 헷갈린다.
#
# `/data3/DiaRUGA` 만 운영과 함께 쓴다 — 사진은 읽기만 하고, 썸네일 캐시는
# 경로로 키를 잡아 두 판이 같은 것을 만든다(v0.8.2 는 썸네일 코드를 안 건드렸다).
name: diaruga-test

services:
  web:
    # root 로 돌면 사본 DB 소유자가 바뀐다. 운영과 같은 이유로 지킨다.
    user: "1000:1000"
    env_file: [.env]
    environment:
      TZ: Asia/Seoul
    image: honestjung/diaruga:${IMAGE_TAG:?IMAGE_TAG 를 .env 에 넣을 것}
    entrypoint: ["/app/deploy/entrypoint-web.sh"]
    volumes:
      # 사본 DB. **디렉토리째로** 물린다 — WAL 의 -wal·-shm 형제 때문이다
      - /srv/DiaRUGA/test/db:/srv/DiaRUGA/test/db
      # 사진·산출물은 운영과 함께 본다 (읽기 + 썸네일 캐시)
      - /data3/DiaRUGA:/data3/DiaRUGA
      # 노두 현장 사진 **사본**. NAS 원본을 물리면 테스트에서 지운 것이 진짜로 지워진다
      - /srv/DiaRUGA/test/outcrop:/srv/DiaRUGA/test/outcrop
    ports:
      # 루프백에만. 바깥으로 나가는 문은 nginx 의 /DiaRUGATest/ 하나뿐이다
      - "127.0.0.1:8091:9090"
    restart: unless-stopped
